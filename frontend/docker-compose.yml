x-frontend: &frontend
  image: integrione-retail-frontend:dev
  pull_policy: never
  restart: unless-stopped
  init: true
  environment:
    NODE_ENV: production
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  stop_grace_period: 20s

services:
  frontend-1:
    <<: *frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: "26.10"
        NODE_MAJOR: "26"
    ports:
      - "127.0.0.1:3333:3000"

  frontend-2:
    <<: *frontend
    ports:
      - "127.0.0.1:3334:3000"
