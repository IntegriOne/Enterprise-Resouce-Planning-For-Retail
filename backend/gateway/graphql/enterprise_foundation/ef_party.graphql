type SuspendPartyPayload implements MutationResult {
  party: Party
  errors: [MutationError!]!
  was_successful: Boolean!
}

type DeactivatePartyPayload implements MutationResult {
  party: Party
  errors: [MutationError!]!
  was_successful: Boolean!
