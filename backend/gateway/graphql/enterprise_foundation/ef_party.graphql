# Zona 2 — Skema GraphQL domain mitra eksternal (Party), peran bisnis, PIC portal IAM, dan tautan alamat.

enum PartyKind {
  ORGANIZATION
  INDIVIDUAL
  FINANCIAL_ENTITY
  GOVERNMENT_BODY
}

enum PartyStatus {
  PENDING_VERIFICATION
  ACTIVE
  SUSPENDED
  INACTIVE
}

enum PartyRoleKind {
  SUPPLIER
  VENDOR
  CUSTOMER_B2B
  CARRIER
  FINANCIAL_INSTITUTION
  OTHER
}

enum PortalAccessStatus {
  NONE
  PENDING_LINK
  ACTIVE
  REVOKED
}

enum AddressUsageKind {
  REGISTERED_OFFICE
  HEADQUARTERS
  BILLING
  SHIPPING
  OTHER
}

# Party merepresentasikan entitas master mitra bisnis eksternal (`gid://integrione/party/<uuid>`).
type Party implements Node {
  id: ID!
  _id: ID!
  partner_code: String!
  kind: PartyKind!
  display_name: String!
  legal_name: String
  email: String
  phone: String
  website_url: String
  tax_id_number: String
  tax_registered_name: String
  is_pkp: Boolean!
  is_tax_exempt: Boolean!
  tax_exemption_reason: String
  tax_verified_at: Time
  preferred_language: String!
  status: PartyStatus!
  notes: String
  created_at: Time!
  updated_at: Time!
  deleted_at: Time

  # Relasi grafik terhubung milik Party.
  roles(after: String, before: String, first: Int, last: Int): PartyRoleConnection!
  contacts(after: String, before: String, first: Int, last: Int): PartyContactConnection!
  addresses(after: String, before: String, first: Int, last: Int): PartyAddressConnection!
}

type PartyEdge {
  node: Party!
  cursor: String!
}

type PartyConnection {
  edges: [PartyEdge!]!
  nodes: [Party!]!
  pageInfo: PageInfo!
  total_count: Int!
}

# PartyRole merepresentasikan peran bisnis resmi milik satu mitra (`gid://integrione/party-role/<uuid>`).
type PartyRole implements Node {
  id: ID!
  _id: ID!
  party_id: ID!
  role: PartyRoleKind!
  is_active: Boolean!
  reference_note: String
  created_at: Time!
  updated_at: Time!
}

type PartyRoleEdge {
  node: PartyRole!
  cursor: String!
}

type PartyRoleConnection {
  edges: [PartyRoleEdge!]!
  nodes: [PartyRole!]!
  pageInfo: PageInfo!
  total_count: Int!
}

# PartyContact merepresentasikan PIC mitra serta tautan portal IAM opsional (`gid://integrione/party-contact/<uuid>`).
type PartyContact implements Node {
  id: ID!
  _id: ID!
  party_id: ID!
  iam_user_id: ID
  full_name: String!
  job_title: String
  contact_role: String!
  email: String
  phone: String
  portal_access_status: PortalAccessStatus!
  is_primary: Boolean!
  is_active: Boolean!
  created_at: Time!
  updated_at: Time!
  deleted_at: Time
}

type PartyContactEdge {
  node: PartyContact!
  cursor: String!
}

type PartyContactConnection {
  edges: [PartyContactEdge!]!
  nodes: [PartyContact!]!
  pageInfo: PageInfo!
  total_count: Int!
}

# PartyAddress merepresentasikan relasi antara mitra dan master alamat (`gid://integrione/party-address/<uuid>`).
type PartyAddress implements Node {
  id: ID!
  _id: ID!
  party_id: ID!
  address_id: ID!
  usage: AddressUsageKind!
  is_primary: Boolean!
  created_at: Time!
  updated_at: Time!

  # Relasi detail master alamat.
  address: Address
}

type PartyAddressEdge {
  node: PartyAddress!
  cursor: String!
}

type PartyAddressConnection {
  edges: [PartyAddressEdge!]!
  nodes: [PartyAddress!]!
  pageInfo: PageInfo!
  total_count: Int!
}

type PortalAccessEvaluation {
  allowed: Boolean!
  party_id: ID!
  contact_id: ID!
  iam_user_id: ID!
  active_roles: [PartyRoleKind!]!
}

input CreatePartyInput {
  partner_code: String!
  kind: PartyKind!
  display_name: String!
  legal_name: String
  email: String
  phone: String
  website_url: String
  tax_id_number: String
  tax_registered_name: String
  is_pkp: Boolean = false
  is_tax_exempt: Boolean = false
  tax_exemption_reason: String
  tax_verified_at: Time
  preferred_language: String = "id"
  status: PartyStatus = PENDING_VERIFICATION
  notes: String
}

input UpdatePartyProfileInput {
  id: ID!
  kind: PartyKind!
  display_name: String!
  legal_name: String
  email: String
  phone: String
  website_url: String
  preferred_language: String!
  notes: String
}

input UpdatePartyTaxProfileInput {
  id: ID!
  tax_id_number: String
  tax_registered_name: String
  is_pkp: Boolean = false
  is_tax_exempt: Boolean = false
  tax_exemption_reason: String
  tax_verified_at: Time
}

input AssignPartyRoleInput {
  party_id: ID!
  role: PartyRoleKind!
  reference_note: String
}

input UpdatePartyRoleNoteInput {
  id: ID!
  reference_note: String
}

input AddPartyContactInput {
  party_id: ID!
  iam_user_id: ID
  full_name: String!
  job_title: String
  contact_role: String!
  email: String
  phone: String
  portal_access_status: PortalAccessStatus = NONE
  is_primary: Boolean = false
}

input UpdatePartyContactInput {
  id: ID!
  full_name: String!
  job_title: String
  contact_role: String!
  email: String
  phone: String
  is_primary: Boolean = false
}

input LinkPartyAddressInput {
  party_id: ID!
  address_id: ID!
  usage: AddressUsageKind!
  is_primary: Boolean = false
  replace_primary: Boolean = false
}

input UpdatePartyAddressLinkInput {
  id: ID!
  usage: AddressUsageKind!
  is_primary: Boolean = false
  replace_primary: Boolean = false
}

