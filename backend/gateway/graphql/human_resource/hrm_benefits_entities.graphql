}

type BenefitPlanConnection {
  edges: [BenefitPlanEdge!]!
  nodes: [BenefitPlan!]!
  pageInfo: PageInfo!
  total_count: Int!
}

extend type Query {
  benefitPlan(id: ID!): BenefitPlan
