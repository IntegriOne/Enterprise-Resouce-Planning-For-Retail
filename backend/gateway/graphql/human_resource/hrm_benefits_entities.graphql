  plan_name: String!
  benefit_type: String!
  provider_party_reference_id: ID
  jurisdiction_code: String!
  eligibility_rule: String
  employee_contribution_rule_reference_id: ID
  employer_contribution_rule_reference_id: ID
  valid_from: String!
  valid_to: String
  is_active: Boolean!
}

type BenefitPlanEdge {
  cursor: String!
