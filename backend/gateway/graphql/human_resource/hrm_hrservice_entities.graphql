type ServiceRequest implements Node {
  id: ID!
  _id: ID!
  request_number: String!
  worker_id: ID!
  request_type: String!
  requested_by_principal_id: ID!
  assigned_principal_id: ID
  status: String!
  restricted_details_document_version_reference_id: ID!
  opened_at: Time
  due_at: Time
  resolved_at: Time
  resolution_document_version_reference_id: ID
  idempotency_key: String!
}

type ServiceRequestEdge {
  cursor: String!
  node: ServiceRequest!
}

type ServiceRequestConnection {
  edges: [ServiceRequestEdge!]!
  nodes: [ServiceRequest!]!
  pageInfo: PageInfo!
  total_count: Int!
}

extend type Query {
  serviceRequest(id: ID!): ServiceRequest
  serviceRequests(request_number: String, worker_id: String, request_type: String, requested_by_principal_id: String, assigned_principal_id: String, status: String, restricted_details_document_version_reference_id: String, resolution_document_version_reference_id: String, idempotency_key: String, after: String, before: String, first: Int, last: Int): ServiceRequestConnection!
}

input CreateServiceRequestInput {
  request_number: String
  worker_id: ID
  request_type: String
  assigned_principal_id: ID
  status: String
  restricted_details_document_version_reference_id: ID
  due_at: Time
  resolved_at: Time
  resolution_document_version_reference_id: ID
  idempotency_key: String
}

input UpdateServiceRequestInput {
  request_number: String @goField(omittable: true)
  worker_id: ID @goField(omittable: true)
  request_type: String @goField(omittable: true)
  assigned_principal_id: ID @goField(omittable: true)
  status: String @goField(omittable: true)
