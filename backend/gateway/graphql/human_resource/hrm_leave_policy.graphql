  # Gunakan paling banyak satu filter.
  leaveAdjustments(entitlement_id: ID, idempotency_key: String, reason_code: String, requested_by_principal_id: ID, approved_by_principal_id: ID, after: String, before: String, first: Int, last: Int): LeaveAdjustmentConnection!
