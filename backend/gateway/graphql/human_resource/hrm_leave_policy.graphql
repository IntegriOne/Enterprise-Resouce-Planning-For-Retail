type LeavePolicy implements Node {
  id: ID!
  _id: ID!
  policy_code: String!
  policy_version: Int!
  policy_name: String!
  leave_type_code: String!
  jurisdiction_code: String!
  accrual_method: String!
  annual_entitlement: String
  carryover_limit: String
  max_balance: String
  minimum_service_days: Int
  effective_from: String!
  effective_to: String
  is_paid: Boolean!
  is_active: Boolean!
}

type LeavePolicyEdge {
  cursor: String!
  node: LeavePolicy!
}

type LeavePolicyConnection {
  edges: [LeavePolicyEdge!]!
  nodes: [LeavePolicy!]!
  pageInfo: PageInfo!
  total_count: Int!
}

extend type Query {
  leavePolicy(id: ID!): LeavePolicy
  leavePolicies(policy_code: String, leave_type_code: String, jurisdiction_code: String, after: String, before: String, first: Int, last: Int): LeavePolicyConnection!
}

