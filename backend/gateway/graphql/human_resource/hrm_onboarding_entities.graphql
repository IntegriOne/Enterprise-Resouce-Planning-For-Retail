type OnboardingPlan implements Node {
  id: ID!
  _id: ID!
  worker_id: ID!
  plan_code: String!
  plan_version: Int!
  start_date: String!
  target_completion_date: String
  status: String!
  template_reference_id: ID
  created_by_principal_id: ID
  started_at: Time
  started_by_principal_id: ID
  completed_at: Time
  completed_by_principal_id: ID
}

type OnboardingPlanEdge {
  cursor: String!
  node: OnboardingPlan!
}

type OnboardingPlanConnection {
  edges: [OnboardingPlanEdge!]!
  nodes: [OnboardingPlan!]!
  pageInfo: PageInfo!
  total_count: Int!
}

extend type Query {
  onboardingPlan(id: ID!): OnboardingPlan
  onboardingPlans(worker_id: String, plan_code: String, status: String, template_reference_id: String, created_by_principal_id: String, after: String, before: String, first: Int, last: Int): OnboardingPlanConnection!
}

input CreateOnboardingPlanInput {
  worker_id: ID
  plan_code: String
  plan_version: Int
  start_date: String
  target_completion_date: String
  status: String
  template_reference_id: ID
}

input UpdateOnboardingPlanInput {
  worker_id: ID @goField(omittable: true)
  plan_code: String @goField(omittable: true)
  plan_version: Int @goField(omittable: true)
  start_date: String @goField(omittable: true)
  target_completion_date: String @goField(omittable: true)
  status: String @goField(omittable: true)
  template_reference_id: ID @goField(omittable: true)
}

type CreateOnboardingPlanPayload implements MutationResult {
  onboarding_plan: OnboardingPlan
  was_successful: Boolean!
  errors: [MutationError!]!
}

type UpdateOnboardingPlanPayload implements MutationResult {
  onboarding_plan: OnboardingPlan
  was_successful: Boolean!
  errors: [MutationError!]!
}

type DeleteOnboardingPlanPayload implements MutationResult {
  deleted: Boolean
  was_successful: Boolean!
  errors: [MutationError!]!
}

extend type Mutation {
  createOnboardingPlan(input: CreateOnboardingPlanInput!): CreateOnboardingPlanPayload!
  updateOnboardingPlan(id: ID!, input: UpdateOnboardingPlanInput!): UpdateOnboardingPlanPayload!
  deleteOnboardingPlan(id: ID!): DeleteOnboardingPlanPayload!
}

