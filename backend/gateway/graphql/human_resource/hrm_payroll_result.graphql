# Ringkasan hasil kalkulasi untuk reviewer payroll. Nominal menggunakan string desimal.
type PayrollResult implements Node {
  id: ID!
  _id: ID!
  payroll_run_id: ID!
  worker_id: ID!
  currency_code: String!
  gross_amount: String!
  reimbursement_amount: String!
  total_deductions: String!
  employer_cost_amount: String!
  net_pay_amount: String!
  result_status: String!
}

type PayrollResultEdge {
  cursor: String!
  node: PayrollResult!
}

type PayrollResultConnection {
  edges: [PayrollResultEdge!]!
  nodes: [PayrollResult!]!
  pageInfo: PageInfo!
  total_count: Int!
}

extend type Query {
  payrollResult(id: ID!): PayrollResult
  payrollResults(payroll_run_id: ID, worker_id: ID, payroll_group_id: ID, payroll_profile_reference_id: ID, currency_code: String, result_status: String, payment_reference_id: ID, payslip_document_reference_id: ID, after: String, before: String, first: Int, last: Int): PayrollResultConnection!
}

type PayrollResultLine implements Node {
  id: ID!
  _id: ID!
  payroll_result_id: ID!
  component_code: String!
  component_name: String!
  component_type: String!
  amount: String!
  quantity: String
  rate: String
  taxable_base: String
  line_sequence: Int!
}

type PayrollResultLineEdge {
  cursor: String!
  node: PayrollResultLine!
}

type PayrollResultLineConnection {
  edges: [PayrollResultLineEdge!]!
  nodes: [PayrollResultLine!]!
  pageInfo: PageInfo!
  total_count: Int!
}

extend type Query {
  payrollResultLine(id: ID!): PayrollResultLine
  payrollResultLines(payroll_result_id: ID, component_id: ID, after: String, before: String, first: Int, last: Int): PayrollResultLineConnection!
}
