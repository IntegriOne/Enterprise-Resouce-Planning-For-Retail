  employmentContracts(worker_id: ID, contract_number: String, employing_legal_entity_reference_id: ID, contract_type: String, contract_status: String, governing_jurisdiction_code: String, work_country_code: String, collective_agreement_id: ID, signed_document_reference_id: ID, signed_document_version_reference_id: ID, after: String, before: String, first: Int, last: Int): EmploymentContractConnection!
