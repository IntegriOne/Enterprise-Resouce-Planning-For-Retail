type LearningCourse implements Node {
  id: ID!
  _id: ID!
  course_code: String!
  course_version: String!
  course_name: String!
  course_type: String!
  provider_party_reference_id: ID
  delivery_mode: String!
  duration_hours: String
  credential_awarded: Boolean!
  expiry_months: Int
  valid_from: String
  valid_to: String
  is_active: Boolean!
}

type LearningCourseEdge {
  cursor: String!
  node: LearningCourse!
}

type LearningCourseConnection {
  edges: [LearningCourseEdge!]!
  nodes: [LearningCourse!]!
  pageInfo: PageInfo!
  total_count: Int!
}

extend type Query {
  learningCourse(id: ID!): LearningCourse
  learningCourses(course_code: String, course_type: String, provider_party_reference_id: String, after: String, before: String, first: Int, last: Int): LearningCourseConnection!
}

input CreateLearningCourseInput {
  course_code: String
