  course_type: String
  provider_party_reference_id: ID
  delivery_mode: String
  duration_hours: String
  credential_awarded: Boolean
  expiry_months: Int
  valid_from: String
  valid_to: String
  is_active: Boolean
}

input UpdateLearningCourseInput {
  course_code: String @goField(omittable: true)
  course_version: String @goField(omittable: true)
  course_name: String @goField(omittable: true)
  course_type: String @goField(omittable: true)
  provider_party_reference_id: ID @goField(omittable: true)
  delivery_mode: String @goField(omittable: true)
  duration_hours: String @goField(omittable: true)
  credential_awarded: Boolean @goField(omittable: true)
  expiry_months: Int @goField(omittable: true)
  valid_from: String @goField(omittable: true)
  valid_to: String @goField(omittable: true)
  is_active: Boolean @goField(omittable: true)
