message PayrollProfile {
  string id = 1;
  string worker_id = 2;
  string payroll_country_code = 3;
  string payroll_jurisdiction_code = 4;
  string payroll_group_id = 5;
  string employing_legal_entity_reference_id = 6;
  string currency_code = 7;
  optional string tax_profile_reference_id = 8;
  optional string bank_account_token_reference_id = 9;
  optional string tax_status_code = 10;
  optional string withholding_election_reference_id = 11;
  string effective_from = 12;
  optional string effective_to = 13;
  bool is_active = 14;
}
message PayrollProfileInput {
  optional string worker_id = 1;
  optional string payroll_country_code = 2;
  optional string payroll_jurisdiction_code = 3;
  optional string payroll_group_id = 4;
  optional string employing_legal_entity_reference_id = 5;
  optional string currency_code = 6;
  optional string tax_profile_reference_id = 7;
  optional string bank_account_token_reference_id = 8;
  optional string tax_status_code = 9;
  optional string withholding_election_reference_id = 10;
  optional string effective_from = 11;
  optional string effective_to = 12;
  optional bool is_active = 13;
}
message CreatePayrollProfileRequest {
  PayrollProfileInput input = 1;
}
message UpdatePayrollProfileRequest {
  string id = 1;
  PayrollProfileInput input = 2;
  google.protobuf.FieldMask update_mask = 3;
}
message PayrollProfileResponse {
  PayrollProfile item = 1;
}
message PayrollProfilesResponse {
  repeated PayrollProfile items = 1;
  human_resource.common.v1.PageInfo page = 2;
}

