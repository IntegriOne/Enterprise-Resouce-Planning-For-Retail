syntax = "proto3";

package human_resource.workload.payroll.v1;

option go_package = "github.com/integrione/erp-retail/backend/services/human_resource/contract/gen/human_resource/workload/payroll/v1;payrollworkloadv1";

message PostingEvidence {
  string journal_id = 1;
}

message PublicationEvidence {
  string publication_id = 1;
}

message PaymentEvidence {
  string result_id = 1;
  string payment_id = 2;
}

message SettlementEvidence {
  string batch_id = 1;
  string settlement_id = 2;
}

message DeliverPayrollEventRequest {
  string payroll_run_id = 1;
  int32 schema_version = 2;
  oneof evidence {
    PostingEvidence posting = 3;
    PublicationEvidence publication = 4;
    PaymentEvidence payment = 5;
    SettlementEvidence settlement = 6;
  }
}

message DeliverPayrollEventResponse {}

// PayrollEventService menerima bukti Finance melalui listener workload privat HRM.
service PayrollEventService {
  rpc DeliverPayrollEvent(DeliverPayrollEventRequest) returns (DeliverPayrollEventResponse);
}
