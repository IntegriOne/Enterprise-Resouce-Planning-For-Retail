# Konfigurasi Redis Keamanan IAM & Gateway IntegriOne (TLS wajib + ACL + noeviction)

# Hanya dengarkan koneksi TLS; matikan port TCP plaintext sepenuhnya
port 0
tls-port 6379
bind 0.0.0.0
protected-mode yes

# Sertifikat TLS server dan CA verifikasi internal
tls-cert-file /etc/redis/certs/redis.crt
tls-key-file /etc/redis/certs/redis.key
tls-ca-cert-file /etc/redis/certs/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"

# Kebijakan memori fail-closed: tolak penulisan baru jika penuh agar state revoke/session tidak pernah terhapus diam-diam
maxmemory 512mb
maxmemory-policy noeviction

# Persistensi AOF untuk mempertahankan jejak keamanan di atas baseline runtime
dir /data
appendonly yes
appendfsync everysec

# Isolasi hak akses per peran service melalui ACL
aclfile /etc/redis/users.acl

# Matikan perintah destruktif global pada runtime
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
