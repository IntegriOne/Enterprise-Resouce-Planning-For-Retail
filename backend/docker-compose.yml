services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cdc74f9183b351870270f25273e4c81e0643f20f147f0c25
      SERVICES_DB_PASSWORD: d931eeb77575bfc4c1b2b99e11807050529d2756c5d1d5d2
    ports:
      - "127.0.0.1:6543:5432"
    volumes:
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  redis:
    image: redis:latest
    restart: unless-stopped
    command: ["redis-server", "/etc/redis/redis.conf"]
    environment:
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./deploy/redis/redis.conf:/etc/redis/redis.conf:ro
      - ./deploy/redis/users.acl:/etc/redis/users.acl:ro
      - ./deploy/certs:/etc/redis/certs:ro
      - redisdata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=ig_iam_dd97a17159dd5a21640c6517c9b9f30f0a906e32 redis-cli --tls --cacert /etc/redis/certs/ca.crt --user iam_writer -h 127.0.0.1 -p 6379 ping | grep -qx PONG",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  iam:
    build:
      context: .
      dockerfile: services/iam/Dockerfile
    image: integrione-retail-iam:dev
    restart: unless-stopped
    env_file:
      - ./services/iam/.env
    environment:
      TZ: Asia/Jakarta
      IAM_POSTGRES_HOST: postgres
      IAM_POSTGRES_PORT: "5432"
      IAM_POSTGRES_USER: iam_management_svc
      IAM_POSTGRES_PASSWORD: d931eeb77575bfc4c1b2b99e11807050529d2756c5d1d5d2
      IAM_POSTGRES_DB: iam
      IAM_DATABASE_DSN: postgres://iam_management_svc:d931eeb77575bfc4c1b2b99e11807050529d2756c5d1d5d2@postgres:5432/iam?sslmode=disable&TimeZone=Asia/Jakarta
      IAM_TEST_DATABASE_DSN: postgres://iam_management_svc:d931eeb77575bfc4c1b2b99e11807050529d2756c5d1d5d2@postgres:5432/iam_test?sslmode=disable&TimeZone=Asia/Jakarta
      IAM_REDIS_ENABLED: "true"
      IAM_REDIS_ADDR: redis:6379
      IAM_REDIS_CA_CERT_PATH: /etc/integrione/certs/ca.crt
      IAM_REDIS_SERVER_NAME: redis
      IAM_REDIS_TLS_INSECURE_SKIP_VERIFY: "false"
      IAM_EF_GRPC_ENABLED: "true"
      IAM_EF_GRPC_TARGET: enterprise-foundation:9002
      IAM_EF_GRPC_TIMEOUT_SECONDS: "5"
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - ./deploy/certs/ca.crt:/etc/integrione/certs/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  enterprise-foundation:
    build:
      context: .
      dockerfile: services/enterprise_foundation/Dockerfile
    image: integrione-retail-enterprise-foundation:dev
    restart: unless-stopped
    env_file:
      - path: ./services/enterprise_foundation/.env
        required: false
    environment:
      TZ: Asia/Jakarta
      APP_ENV: ${EF_APP_ENV:-production}
      EF_SERVICE_NAME: integrione-enterprise-foundation
      EF_GRPC_HOST: 0.0.0.0
      EF_GRPC_PORT: "9002"
      EF_SHUTDOWN_TIMEOUT_SECONDS: "15"
    ports:
      - "127.0.0.1:9002:9002"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  gateway-1:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: integrione-retail-gateway:dev
    restart: unless-stopped
    env_file:
      - ./gateway/.env
    environment:
      TZ: Asia/Jakarta
      IAM_GRPC_TARGET: iam:9001
      EF_GRPC_ENABLED: "true"
      EF_GRPC_TARGET: enterprise-foundation:9002
      EF_GRPC_TIMEOUT_SECONDS: "5"
      HRM_GRPC_ENABLED: "${HRM_GATEWAY_ENABLED:-false}"
      HRM_GRPC_TARGET: human-resource:9003
      HRM_GRPC_SERVER_NAME: human-resource
      HRM_GRPC_CA_FILE: /etc/integrione/hrm-client/ca.crt
      HRM_GRPC_CLIENT_CERT_FILE: /etc/integrione/hrm-client/client.crt
      HRM_GRPC_CLIENT_KEY_FILE: /etc/integrione/hrm-client/client.key
      HRM_GRPC_HMAC_SECRET_FILE: /etc/integrione/hrm-client/hmac.key
      HRM_GRPC_TIMEOUT_SECONDS: "5"
      GATEWAY_REDIS_ENABLED: "true"
      GATEWAY_REDIS_ADDR: redis:6379
      GATEWAY_REDIS_CA_CERT_PATH: /etc/integrione/certs/ca.crt
      GATEWAY_REDIS_SERVER_NAME: redis
      GATEWAY_REDIS_TLS_INSECURE_SKIP_VERIFY: "false"
    ports:
      - "127.0.0.1:5000:8080"
    volumes:
      - ./deploy/certs/ca.crt:/etc/integrione/certs/ca.crt:ro
      - ./gateway/.local/hrm-client:/etc/integrione/hrm-client:ro
    depends_on:
      iam:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  gateway-2:
    image: integrione-retail-gateway:dev
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ./gateway/.env
    environment:
      TZ: Asia/Jakarta
      IAM_GRPC_TARGET: iam:9001
      EF_GRPC_ENABLED: "true"
      EF_GRPC_TARGET: enterprise-foundation:9002
      EF_GRPC_TIMEOUT_SECONDS: "5"
      HRM_GRPC_ENABLED: "${HRM_GATEWAY_ENABLED:-false}"
      HRM_GRPC_TARGET: human-resource:9003
      HRM_GRPC_SERVER_NAME: human-resource
      HRM_GRPC_CA_FILE: /etc/integrione/hrm-client/ca.crt
      HRM_GRPC_CLIENT_CERT_FILE: /etc/integrione/hrm-client/client.crt
      HRM_GRPC_CLIENT_KEY_FILE: /etc/integrione/hrm-client/client.key
      HRM_GRPC_HMAC_SECRET_FILE: /etc/integrione/hrm-client/hmac.key
      HRM_GRPC_TIMEOUT_SECONDS: "5"
      GATEWAY_REDIS_ENABLED: "true"
      GATEWAY_REDIS_ADDR: redis:6379
      GATEWAY_REDIS_CA_CERT_PATH: /etc/integrione/certs/ca.crt
      GATEWAY_REDIS_SERVER_NAME: redis
      GATEWAY_REDIS_TLS_INSECURE_SKIP_VERIFY: "false"
    ports:
      - "127.0.0.1:5001:8080"
    volumes:
      - ./deploy/certs/ca.crt:/etc/integrione/certs/ca.crt:ro
      - ./gateway/.local/hrm-client:/etc/integrione/hrm-client:ro
    depends_on:
      gateway-1:
        condition: service_healthy
      iam:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  pgdata18:
    external: true
    name: deploy_pgdata18
  redisdata:
    external: true
    name: deploy_redisdata
